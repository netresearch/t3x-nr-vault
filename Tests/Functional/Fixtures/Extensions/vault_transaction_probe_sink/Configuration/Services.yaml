# Registers TransactionProbeSink as an audit sink. The class lives in the test
# tree (composer-autoloaded), so the fixture needs no autoload of its own.
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Netresearch\NrVault\Tests\Functional\Fixtures\TransactionProbe\TransactionProbeSink:
    tags: ['nr_vault.audit_sink']
