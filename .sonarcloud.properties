# SonarCloud configuration (consumed by SonarCloud Automatic Analysis).
#
# Exclude Fluid templates from analysis. SonarCloud's HTML/Web sensor parses
# them as standalone HTML documents, which they are not: a Fluid backend-module
# template starts with the namespace tag
#   <html xmlns:f="..." data-namespace-typo3-fluid="true">
# (stripped at render time) and produces a fragment injected into the TYPO3
# backend <body> — the backend chrome supplies <!DOCTYPE>, <html lang> and <title>.
#
# This causes false positives that are not real defects:
#   - DoctypePresenceCheck / S5254 (lang) / PageWithoutTitleCheck on the namespace tag
#   - S6793 "aria-valuenow must be a number" on aria-valuenow="{fluid.var}" (numeric at runtime)
#   - S6819 "use a semantic element instead of role=…" on the Bootstrap/WAI-ARIA
#     role="group"/role="progressbar" markup mandated by the TYPO3 backend style guide
#
# Templates are exercised end-to-end by functional + E2E tests, not by the HTML sensor.
sonar.exclusions=Resources/Private/Templates/**/*.html,Resources/Private/Partials/**/*.html,Resources/Private/Layouts/**/*.html
