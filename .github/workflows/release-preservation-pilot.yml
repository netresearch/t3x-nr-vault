name: Release Preservation Precheck

# Temporary native proof on this exact branch. There is no publisher or tag
# creation. A first push bootstraps a new workflow before manual dispatch exists.
on:
  push:
    branches: ['ci/release-preservation-pilot-20261028']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-preservation-pilot-${{ github.ref }}
  cancel-in-progress: false

env:
  TESTED_COMMIT: '1bf5c2075a2ba8ed1eff91ce82e87718c448771c'

jobs:
  evidence:
    uses: ./.github/workflows/release-evidence.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # Kept identical to TESTED_COMMIT. No release-tag input: actual precheck.
      ref: '1bf5c2075a2ba8ed1eff91ce82e87718c448771c'

  preservation-gate:
    name: Verify evidence preservation across failed-job retry
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout pilot verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check fail-closed pilot fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 Build/Scripts/test-release-preservation-pilot.py

      - name: Download original same-run evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.evidence.outputs.artifact-name }}
          path: evidence

      - name: Verify outputs and artifact, then fail only on attempt one
        env:
          ACTUAL_COMMIT: ${{ needs.evidence.outputs.actual-commit }}
          PRODUCER_IDENTITY: ${{ needs.evidence.outputs.release-tag }}
          ARTIFACT_NAME: ${{ needs.evidence.outputs.artifact-name }}
          BUNDLE_DIGEST: ${{ needs.evidence.outputs.bundle-sha256 }}
        run: |
          python3 Build/Scripts/verify-release-preservation-pilot.py \
            --expected "$TESTED_COMMIT" --actual "$ACTUAL_COMMIT" \
            --identity "$PRODUCER_IDENTITY" --artifact "$ARTIFACT_NAME" \
            --digest "$BUNDLE_DIGEST" --directory evidence \
            --attempt "$GITHUB_RUN_ATTEMPT" --run-id "$GITHUB_RUN_ID"
