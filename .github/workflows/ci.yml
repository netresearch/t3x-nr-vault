name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it, so
# superseded test matrices stop taking runners. Runs on main, in the merge
# queue and on the schedule are never cancelled. The group sits here in the
# caller, not in the reusable workflow: a caller that invokes ci.yml twice
# would otherwise put both calls in one group and cancel one with the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Per-extension test matrix (intentional-drift). Security/quality jobs are in checks.yml.
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4","8.5"]'
      typo3-versions: '["^13.4","^14.3"]'
      run-functional-tests: true
      # Repo-specific checks (composer ci:test:repo: arch + doc-cli + its
      # self-test + the evidence-collector self-test). All four are static
      # file scans needing no dependency tree, which is the shared job's
      # contract — without this input they ran only when someone invoked
      # the full gate set by hand, which is how the vault:store doc drift
      # went unnoticed (#308).
      run-repo-checks: true
      upload-coverage: true
      upload-test-results: true
      coverage-tool: 'xdebug'
      php-extensions: 'intl, mbstring, xml, sodium, json'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
