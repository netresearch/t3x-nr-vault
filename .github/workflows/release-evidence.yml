# Temporary pilot branch only. Never merge this diagnostic entry point.
name: Coverage Exit Paired Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-exit-paired-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-exit-paired:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/coverage-exit-pilot-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      XDEBUG_MODE: coverage
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout immutable corrected application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '0b99a1dd50c653f4cc31c5ed120419ce7a5d8ebe'
          fetch-depth: 0
          persist-credentials: false

      - name: Setup fixed PHP and coverage runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5.12'
          extensions: intl, mbstring, xml, sodium, json, xdebug-3.5.3
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies once for both complete Audit phases
        env:
          CAPTAINHOOK_DISABLE: 'true'
        run: |
          set -euo pipefail
          mkdir -p .Build/coverage-exit-pilot
          composer install --prefer-dist --no-progress
          composer show --format=json > .Build/coverage-exit-pilot/dependencies.json

      - name: Checkout same-run diagnostic tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .workflow-tools
          sparse-checkout: |
            Build/Scripts/coverage-exit-pilot.py
            Build/Scripts/coverage-exit-read.php
            Build/Scripts/test-coverage-exit-pilot.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify fail-closed diagnostic controls
        run: python3 .workflow-tools/Build/Scripts/test-coverage-exit-pilot.py

      - name: Freeze source runtime full references and original failure controls
        run: |
          set -euo pipefail
          python3 .workflow-tools/Build/Scripts/coverage-exit-pilot.py prepare 2>&1 | tee .Build/coverage-exit-pilot/prepare.log

      - name: Run complete Audit with original immutable worker
        run: python3 .workflow-tools/Build/Scripts/coverage-exit-pilot.py old

      - name: Require original 660 cases full paths and unchanged installation
        run: python3 .workflow-tools/Build/Scripts/coverage-exit-pilot.py accept-old

      - name: Run complete Audit with corrected immutable worker
        run: python3 .workflow-tools/Build/Scripts/coverage-exit-pilot.py new

      - name: Require corrected 660 cases full paths and confirmed cleanup
        run: python3 .workflow-tools/Build/Scripts/coverage-exit-pilot.py accept-new

      - name: Require complete paired coverage and frozen-input equality
        if: always()
        run: python3 .workflow-tools/Build/Scripts/coverage-exit-pilot.py final

      - name: Preserve both original parts and all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-exit-paired-diagnostic
          overwrite: true
          path: .Build/coverage-exit-pilot/
          if-no-files-found: error
          retention-days: 7
