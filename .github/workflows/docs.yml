name: Documentation

# Automatic rendering and the PR preview artifact come from CI. Keep this
# entry point for an explicit documentation-only rerender.
on:
  workflow_dispatch:

permissions: {}

jobs:
  docs:
    uses: netresearch/typo3-ci-workflows/.github/workflows/docs.yml@main
    permissions:
      contents: read
