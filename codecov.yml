# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference
#
# Coverage is BLOCKING. Every status below sets `informational: false`, so a drop
# fails the check instead of posting a note nobody reads. Two tiers:
#
#   * repo-wide defaults (`coverage.status`) — the floor for ordinary changes;
#   * per-component statuses (`component_management`) — a stricter floor for the
#     security-critical directories, where an untested line is a latent
#     vulnerability rather than a coverage statistic.
#
# The project status uses `target: auto` with a 0.5% threshold: a ratchet.
# Coverage may not fall below the base commit by more than rounding noise, so the
# number only moves upward over time.

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: auto
        # Ratchet: at most 0.5% below the base commit. Deliberately tight —
        # anything larger is a real regression, not measurement jitter.
        threshold: 0.5%
        informational: false
    patch:
      default:
        # New and changed lines must be 80% covered repo-wide.
        target: 80%
        threshold: 2%
        informational: false

# Branch / path coverage for PHP is derived from Clover XML automatically by
# Codecov — no parser tweaks needed. (The legacy `parsers.gcov.*` block only
# applies to C/C++ coverage sources and is ignored for PHP uploads.)

# ---------------------------------------------------------------------------
# Security-critical components.
#
# Patch coverage on these paths must be 90%: envelope encryption and master-key
# handling (Crypto), authorization and technical-actor context (Security), and
# the tamper-evident audit chain (Audit). The 1% threshold absorbs rounding on
# small diffs without opening a meaningful gap.
#
# Raising a target is always fine. LOWERING one — or dropping a path from a
# component — needs security-team sign-off recorded in the PR description, the
# same rule the mutation ratchet in `infection-security.json5` follows.
# ---------------------------------------------------------------------------
component_management:
  default_rules:
    statuses:
      - type: patch
        target: 90%
        threshold: 1%
        informational: false

  individual_components:
    - component_id: crypto
      name: crypto
      paths:
        - Classes/Crypto/**

    - component_id: security
      name: security
      paths:
        - Classes/Security/**

    - component_id: audit
      name: audit
      paths:
        - Classes/Audit/**

flags:
  unit:
    paths:
      - Classes/
    carryforward: true
  functional:
    paths:
      - Classes/
    carryforward: true

comment:
  layout: "reach,diff,flags,components,files"
  behavior: default
  require_changes: true

ignore:
  - "Tests/**/*"
  - ".Build/**/*"
  - ".ddev/**/*"
  # ---------------------------------------------------------------------------
  # Mirror of the <exclude> list in Build/phpunit.xml — keep the two in sync.
  # Without this, Codecov counts files the coverage run deliberately skips and
  # reports a project number lower than what the suite actually measures.
  # ---------------------------------------------------------------------------
  # Backend controllers + form element: depend on final TYPO3 classes, covered
  # through functional/E2E tests (which upload no coverage).
  - "Classes/Controller/AuditController.php"
  - "Classes/Controller/MigrationController.php"
  - "Classes/Controller/OverviewController.php"
  - "Classes/Controller/SecretsController.php"
  - "Classes/Controller/ModuleAccessGuard.php"
  - "Classes/Form/Element/VaultSecretInputElement.php"
  # Enums: PHPUnit 12 cannot attribute coverage to enum classes.
  - "Classes/Http/SecretPlacement.php"
  - "Classes/Service/Detection/Severity.php"
  - "Classes/Service/VaultFieldPermission.php"
  - "Classes/Security/VaultPermission.php"
  - "Classes/Service/Doctor/FindingSeverity.php"
  - "Classes/Secret/SecretIdentifierKind.php"
  # Constant holders without executable code.
  - "Classes/Service/Doctor/DocsLink.php"
  - "Classes/Service/Detection/SecretFinding.php"
  # Exceptions: excluded as a directory in Build/phpunit.xml.
  - "Classes/Exception/**/*"
