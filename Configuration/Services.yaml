services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Every AuditSinkInterface implementation discovered by the resource glob below
  # is tagged automatically, so the registry receives new sinks without another
  # edit here. A consuming extension adds its own destination by implementing the
  # interface and applying the same tag in ITS Services.yaml.
  _instanceof:
    Netresearch\NrVault\Audit\Sink\AuditSinkInterface:
      tags: ['nr_vault.audit_sink']
    # Same discovery contract for the vault:doctor readiness checks: implement
    # the interface and the doctor service receives it, with no edit here and no
    # way for a check to be silently left out of the report.
    Netresearch\NrVault\Service\Doctor\ReadinessCheckInterface:
      tags: ['nr_vault.readiness_check']

  Netresearch\NrVault\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Exception/*'
      - '../Classes/Http/OAuth/OAuthConfig.php'
      - '../Classes/Security/TechnicalActor.php'
      - '../Classes/Security/BreakGlassSession.php'
      # Widgets depend on typo3/cms-dashboard classes (a "suggest", not a
      # requirement) — they are registered by Services.Dashboard.php, imported
      # from Services.php only when EXT:dashboard is installed.
      - '../Classes/Widgets/*'

  # ----- Interface aliases -------------------------------------------------
  # Symfony's `autoconfigure` auto-aliases an interface to its single
  # implementation when the resource glob discovers both; these explicit
  # aliases make the intent reviewable and stay correct even if a second
  # implementation is added later.
  #
  # `public: true` is only set where the runtime explicitly calls
  # `GeneralUtility::makeInstance(<Interface>::class)` — verified by
  # grepping `Classes/` + `Tests/Functional/` + `Tests/Fuzz/`:
  #   - VaultServiceInterface: 3 sites (Form/Element/Task)
  #   - SecretRepositoryInterface: OrphanCleanupTask scheduler context
  # Every other alias resolves via constructor DI only and can stay private.

  Netresearch\NrVault\Configuration\ExtensionConfigurationInterface:
    alias: Netresearch\NrVault\Configuration\ExtensionConfiguration

  Netresearch\NrVault\Crypto\EncryptionServiceInterface:
    alias: Netresearch\NrVault\Crypto\EncryptionService

  # public: consuming extensions resolve the codec via
  # GeneralUtility::makeInstance(EnvelopeCodecInterface::class) where they
  # encrypt their own payloads outside a DI-constructed service (ADR-032).
  Netresearch\NrVault\Crypto\EnvelopeCodecInterface:
    alias: Netresearch\NrVault\Crypto\EnvelopeCodec
    public: true

  # public: consuming extensions redact secrets from log lines and outbound
  # payloads in contexts without constructor injection (ADR-031).
  Netresearch\NrVault\Secret\SecretRedactorInterface:
    alias: Netresearch\NrVault\Secret\SecretRedactor
    public: true

  Netresearch\NrVault\Http\VaultHttpClientFactoryInterface:
    alias: Netresearch\NrVault\Http\VaultHttpClientFactory

  Netresearch\NrVault\Http\DnsResolverInterface:
    alias: Netresearch\NrVault\Http\DefaultDnsResolver

  Netresearch\NrVault\Service\VaultServiceInterface:
    alias: Netresearch\NrVault\Service\VaultService
    # public: makeInstance call sites in FormEngine (VaultSecretElement,
    # VaultSecretInputElement) and OrphanCleanupTask (scheduler context
    # where DI isn't available).
    public: true

  Netresearch\NrVault\Security\AccessControlServiceInterface:
    alias: Netresearch\NrVault\Security\AccessControlService

  Netresearch\NrVault\Security\TechnicalActorContextInterface:
    alias: Netresearch\NrVault\Security\TechnicalActorContext

  # public: integrator PHP (a userFunc, DataProcessor or eID handler) resolves
  # this via GeneralUtility::makeInstance(FrontendPlaceholderPolicyInterface::class)
  # to publish an identifier for frontend resolution — the A4 escape hatch of
  # ADR-034, same precedent as SiteConfigurationVaultProcessor.
  #
  # This is a shared (singleton) service on purpose, and it must stay safe as
  # one: allowIdentifier() takes the PSR-7 request and stores the grant in a
  # WeakMap keyed on it, so no grant and no log latch can reach a later request.
  # Do NOT "fix" request scoping by adding `shared: false` — the consumer of
  # this service is itself a singleton and would keep the first instance.
  Netresearch\NrVault\Security\FrontendPlaceholderPolicyInterface:
    alias: Netresearch\NrVault\Security\FrontendPlaceholderPolicy
    public: true

  # Two implementations exist for the read-only state contract
  # (BreakGlassState and BreakGlassService, which extends it), so autowiring
  # cannot pick one — both aliases must be explicit.
  #
  # AccessControlService MUST receive the narrow BreakGlassState, not the full
  # service: the service writes audit rows, AuditLogService depends on
  # AccessControlService, and injecting the service here would close that DI
  # cycle. It also means access control cannot open a window, only observe one.
  Netresearch\NrVault\Security\BreakGlassStateInterface:
    alias: Netresearch\NrVault\Security\BreakGlassState

  Netresearch\NrVault\Security\BreakGlassServiceInterface:
    alias: Netresearch\NrVault\Security\BreakGlassService
  Netresearch\NrVault\Audit\AuditLogServiceInterface:
    alias: Netresearch\NrVault\Audit\AuditLogService

  Netresearch\NrVault\Audit\AuditChainRekeyServiceInterface:
    alias: Netresearch\NrVault\Audit\AuditChainRekeyService

  Netresearch\NrVault\Audit\AuditChainAnchorStoreInterface:
    alias: Netresearch\NrVault\Audit\AuditChainAnchorStore

  Netresearch\NrVault\Audit\Sink\AuditSinkRegistryInterface:
    alias: Netresearch\NrVault\Audit\Sink\AuditSinkRegistry

  Netresearch\NrVault\Audit\Sink\SinkDeliveryStateRepositoryInterface:
    alias: Netresearch\NrVault\Audit\Sink\SinkDeliveryStateRepository

  Netresearch\NrVault\Audit\Anchor\AnchorReaderInterface:
    alias: Netresearch\NrVault\Audit\Anchor\AnchorFileReader

  Netresearch\NrVault\Audit\Anchor\ChainTipAnchorServiceInterface:
    alias: Netresearch\NrVault\Audit\Anchor\ChainTipAnchorService
    # public: AuditAnchorTask / AuditVerifyTask run in the scheduler context,
    # which unserializes task objects outside the DI container and resolves the
    # service via GeneralUtility::makeInstance(<Interface>::class).
    public: true

  Netresearch\NrVault\Adapter\VaultAdapterInterface:
    alias: Netresearch\NrVault\Adapter\LocalEncryptionAdapter

  Netresearch\NrVault\Domain\Repository\SecretRepositoryInterface:
    alias: Netresearch\NrVault\Domain\Repository\SecretRepository
    # public: OrphanCleanupTask runs in the scheduler context (unserialized
    # with null ctor args) and resolves the repository via
    # GeneralUtility::makeInstance(SecretRepositoryInterface::class) for its
    # UID-windowed orphan scan — which requires a public alias.
    public: true

  Netresearch\NrVault\Service\SecretDetectionServiceInterface:
    alias: Netresearch\NrVault\Service\SecretDetectionService

  Netresearch\NrVault\Configuration\SiteConfigurationVaultProcessorInterface:
    alias: Netresearch\NrVault\Configuration\SiteConfigurationVaultProcessor

  Netresearch\NrVault\Http\VaultHttpClientInterface:
    alias: Netresearch\NrVault\Http\VaultHttpClient

  # `$clonedFrom` is the seam the with*() clones use to carry "this inner client
  # came from the factory" across a fluent chain, so it is typed as
  # VaultHttpClient itself. Autowiring would read that as a dependency on the
  # very service being built and refuse the container with a circular
  # reference. Pinning the argument to null leaves every other one autowired,
  # and the container-built instance is the one that has no prototype anyway.
  Netresearch\NrVault\Http\VaultHttpClient:
    arguments:
      $clonedFrom: null

  Netresearch\NrVault\Service\Analytics\VaultAnalyticsServiceInterface:
    alias: Netresearch\NrVault\Service\Analytics\VaultAnalyticsService

  Netresearch\NrVault\Service\Doctor\VaultDoctorServiceInterface:
    alias: Netresearch\NrVault\Service\Doctor\VaultDoctorService

  # ----- Factory-resolved services ----------------------------------------
  # Factories cannot be discovered by autowire and must be declared explicitly.

  Netresearch\NrVault\Crypto\MasterKeyProviderInterface:
    factory: ['@Netresearch\NrVault\Crypto\MasterKeyProviderFactory', 'create']

  # ----- External audit sinks ---------------------------------------------

  Netresearch\NrVault\Audit\Sink\AuditSinkRegistry:
    arguments:
      $sinks: !tagged_iterator nr_vault.audit_sink

  Netresearch\NrVault\Service\Doctor\Check\SinkProbeCheck:
    arguments:
      $sinks: !tagged_iterator nr_vault.audit_sink

  # ----- Readiness checks (vault:doctor) ----------------------------------

  Netresearch\NrVault\Service\Doctor\VaultDoctorService:
    arguments:
      $checks: !tagged_iterator nr_vault.readiness_check

  Netresearch\NrVault\Security\CurrentBackendUserProvider:
    arguments:
      $request: '@Psr\Http\Message\ServerRequestInterface'

  # The webhook sink deliberately uses a SHORT-timeout client built by
  # SecureHttpClientFactory rather than the ambient PSR-18 client: audit fan-out
  # must inherit the extension-wide SSRF / DNS-rebinding / no-redirect defences
  # (Tests/Architecture enforces that no other class stands up its own Guzzle
  # client), and a slow collector must not hold a web request open. 3s total
  # bounds the whole transfer; connect_timeout stays platform-managed.
  nr_vault.audit_sink.webhook_client:
    class: Psr\Http\Client\ClientInterface
    factory: ['@Netresearch\NrVault\Http\SecureHttpClientFactory', 'create']
    arguments: [3]

  Netresearch\NrVault\Audit\Sink\WebhookAuditSink:
    arguments:
      $httpClient: '@nr_vault.audit_sink.webhook_client'

  # ----- Classes that need public visibility ------------------------------
  # TYPO3 DataHandler resolves $TYPO3_CONF_VARS hook references via
  # GeneralUtility::makeInstance, which needs the service to be public.

  Netresearch\NrVault\Hook\DataHandlerHook:
    public: true

  Netresearch\NrVault\Hook\FlexFormVaultHook:
    public: true

  Netresearch\NrVault\Hook\SecretTcaHook:
    public: true

  # FormEngine instantiates form-element nodes via NodeFactory which uses
  # makeInstance; the resolved service must be public.
  Netresearch\NrVault\Service\VaultFieldPermissionService:
    public: true

  # SiteConfigurationVaultProcessor is invoked via
  # `GeneralUtility::makeInstance(SiteConfigurationVaultProcessor::class)`
  # from third-party code that hooks into the site-configuration event
  # (documented in the class docblock as the public API entry point).
  # Required ctor args (VaultServiceInterface) → must be public.
  Netresearch\NrVault\Configuration\SiteConfigurationVaultProcessor:
    public: true

  # VaultFieldResolver / FlexFormVaultResolver are documented public API
  # for callers that need to translate a TCA vault-field reference to its
  # secret identifier. Functional tests + downstream extension code use
  # `GeneralUtility::makeInstance(...)` to construct them; both have
  # required ctor args so they must be public for DI resolution.
  Netresearch\NrVault\Utility\VaultFieldResolver:
    public: true

  Netresearch\NrVault\Utility\FlexFormVaultResolver:
    public: true

  # ----- Tagged services that need explicit registration ------------------
  # The `upgrade.wizard` tag has no #[Attribute] form yet (unlike
  # #[AsCommand] / #[AsController] / #[AsEventListener]) so it must be
  # tagged explicitly with the wizard identifier.

  Netresearch\NrVault\Upgrades\AuditHmacMigrationWizard:
    tags:
      - name: upgrade.wizard
        identifier: nrVaultAuditHmacMigration

  # Consuming extensions that store their own sealed envelopes tag a
  # ForeignEnvelopeRotatorInterface implementation with
  # 'nrvault.foreign_envelope_rotator' in THEIR Services.yaml; the rotate
  # command re-wraps them inside its own transaction (ADR-033).
  Netresearch\NrVault\Command\VaultRotateMasterKeyCommand:
    arguments:
      $foreignRotators: !tagged_iterator nrvault.foreign_envelope_rotator

  # ----- Notes on removed entries -----------------------------------------
  # - 6 controller entries — covered by #[AsController] + autoconfigure.
  # - 13 command entries — covered by #[AsCommand] + autoconfigure.
  # - 11 redundant `public: true` flags on interface aliases — interfaces
  #   resolve via constructor DI, no $container->get() / makeInstance use.
  #   (VaultServiceInterface kept public — 3 makeInstance call sites.)
  # - Manual `$eventDispatcher` arg on VaultService — autowire handles it.
  # - Concrete-class `public: true` entries that aren't fetched outside the
  #   DI graph (ExtensionConfiguration, VaultHttpClientFactory,
  #   SecretDetectionService, VaultHttpClient) — constructor injection is
  #   enough.
